
<!DOCTYPE html>
<html lang="en">
<head>


  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fueling Tracker" />
  <title>Fueling & Hydration Tracker</title>
    <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9ZZ6Z8L61Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-9ZZ6Z8L61Y');
  </script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-teal-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const STORAGE_KEY = 'fueling_hydration_tracker_data';

    const DEFAULT_FUELINGS = [
      { id: 1, name: 'Fueling 1', time: '08:00 AM', completed: false },
      { id: 2, name: 'Fueling 2', time: '10:30 AM', completed: false },
      { id: 3, name: 'Fueling 3', time: '01:00 PM', completed: false },
      { id: 4, name: 'Fueling 4', time: '03:30 PM', completed: false },
      { id: 5, name: 'Fueling 5', time: '06:00 PM', completed: false },
    ];

    const DEFAULT_LEAN_GREEN = { name: 'Lean & Green Meal', time: 'Flexible', completed: false };

    // Helper: Format Date object to 12-hour 'hh:mm AM/PM' format
    function formatTime(dateObj) {
      let hours = dateObj.getHours();
      const minutes = dateObj.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const strMinutes = minutes < 10 ? '0' + minutes : minutes;
      const strHours = hours < 10 ? '0' + hours : hours;
      return `${strHours}:${strMinutes} ${ampm}`;
    }

    // Helper: Parse 'hh:mm AM/PM' string into a JavaScript Date object on today's date
    function parseTimeString(timeStr) {
      if (!timeStr) return new Date();
      const match = timeStr.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
      if (!match) return null;

      let hours = parseInt(match[1], 10);
      const minutes = parseInt(match[2], 10);
      const period = match[3] ? match[3].toUpperCase() : null;

      if (period) {
        if (period === 'PM' && hours < 12) hours += 12;
        if (period === 'AM' && hours === 12) hours = 0;
      }

      const d = new Date();
      d.setHours(hours, minutes, 0, 0);
      return d;
    }

    // Helper: Add hours to a Date object
    function addHours(baseDate, hoursToAdd) {
      return new Date(baseDate.getTime() + hoursToAdd * 60 * 60 * 1000);
    }

    function FuelingTracker() {
      const [loaded, setLoaded] = useState(false);
      const [water, setWater] = useState(0);
      const [fuelings, setFuelings] = useState(DEFAULT_FUELINGS);
      const [leanAndGreen, setLeanAndGreen] = useState(DEFAULT_LEAN_GREEN);
      const [saveError, setSaveError] = useState(false);
      const [editingId, setEditingId] = useState(null); // String or ID ('lean_green' or fueling ID)

      // Load saved data from localStorage on mount
      useEffect(() => {
        try {
          const savedData = localStorage.getItem(STORAGE_KEY);
          if (savedData) {
            const data = JSON.parse(savedData);
            if (typeof data.water === 'number') setWater(data.water);
            if (Array.isArray(data.fuelings)) setFuelings(data.fuelings);
            if (data.leanAndGreen) setLeanAndGreen(data.leanAndGreen);
          }
        } catch (err) {
          console.error("Failed to load data from localStorage", err);
        } finally {
          setLoaded(true);
        }
      }, []);

      // Save state changes to localStorage
      useEffect(() => {
        if (!loaded) return;
        try {
          const payload = JSON.stringify({ water, fuelings, leanAndGreen });
          localStorage.setItem(STORAGE_KEY, payload);
          setSaveError(false);
        } catch (err) {
          console.error("Failed to write to localStorage", err);
          setSaveError(true);
        }
      }, [water, fuelings, leanAndGreen, loaded]);

      // Handlers
      const addWater = (amount) => setWater((prev) => Math.max(0, prev + amount));

      // Toggle Fueling Completion: Stamp current time upon completion & recalculate subsequent pending fuelings
      const toggleFueling = (id) => {
        setFuelings(prevFuelings => {
          const targetIndex = prevFuelings.findIndex(f => f.id === id);
          if (targetIndex === -1) return prevFuelings;

          const isCompleting = !prevFuelings[targetIndex].completed;
          const nextFuelings = [...prevFuelings];

          if (isCompleting) {
            const now = new Date();
            const nowTimeString = formatTime(now);

            // Stamp current time on completed fueling
            nextFuelings[targetIndex] = {
              ...nextFuelings[targetIndex],
              completed: true,
              time: nowTimeString
            };

            // Recalculate remaining future uncompleted fuelings starting 2.5 hours from NOW
            let currentBaseTime = now;
            for (let i = targetIndex + 1; i < nextFuelings.length; i++) {
              if (!nextFuelings[i].completed) {
                currentBaseTime = addHours(currentBaseTime, 2.5);
                nextFuelings[i] = {
                  ...nextFuelings[i],
                  time: formatTime(currentBaseTime)
                };
              }
            }
          } else {
            // Unchecking fueling
            nextFuelings[targetIndex] = {
              ...nextFuelings[targetIndex],
              completed: false
            };
          }

          return nextFuelings;
        });
      };

      // Updates target time manually and recalculates all subsequent fuelings 2.5 hours apart
      const updateFuelingTime = (id, newTime) => {
        setFuelings(prevFuelings => {
          const nextFuelings = prevFuelings.map(f => f.id === id ? { ...f, time: newTime } : f);
          const changedIndex = nextFuelings.findIndex(f => f.id === id);

          let currentBaseTime = parseTimeString(newTime);
          if (!currentBaseTime) return nextFuelings; // Fallback if format is invalid

          // Chain recalculations for all subsequent fuelings
          for (let i = changedIndex + 1; i < nextFuelings.length; i++) {
            currentBaseTime = addHours(currentBaseTime, 2.5);
            nextFuelings[i] = {
              ...nextFuelings[i],
              time: formatTime(currentBaseTime)
            };
          }

          return nextFuelings;
        });
      };

      // Toggle Lean & Green: Stamp current time and recalculate all remaining uncompleted fuelings 2.5 hours apart
      const toggleLeanAndGreen = () => {
        const nextCompletedState = !leanAndGreen.completed;
        const now = new Date();

        if (nextCompletedState) {
          const nowTimeString = formatTime(now);

          // 1. Stamp Lean & Green with current local time
          setLeanAndGreen(prev => ({
            ...prev,
            completed: true,
            time: nowTimeString
          }));

          // 2. Recalculate all remaining uncompleted fuelings sequentially 2.5 hrs apart from now
          let currentBaseTime = now;
          setFuelings(prevFuelings =>
            prevFuelings.map(f => {
              if (!f.completed) {
                currentBaseTime = addHours(currentBaseTime, 2.5);
                return { ...f, time: formatTime(currentBaseTime) };
              }
              return f;
            })
          );
        } else {
          // Unchecking Lean & Green
          setLeanAndGreen(prev => ({
            ...prev,
            completed: false
          }));
        }
      };

      const updateLeanAndGreenTime = (newTime) => {
        setLeanAndGreen(prev => ({ ...prev, time: newTime }));
      };

      const resetDay = () => {
        if (window.confirm("Are you sure you want to reset today's progress?")) {
          setWater(0);
          setFuelings(DEFAULT_FUELINGS.map(f => ({ ...f, completed: false })));
          setLeanAndGreen(DEFAULT_LEAN_GREEN);
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch (e) {
            console.error("Failed to clear localStorage", e);
          }
        }
      };

      const waterTarget = 64;
      const waterProgress = Math.min(100, (water / waterTarget) * 100);
      const completedFuelingsCount = fuelings.filter(f => f.completed).length;
      const totalMealsCompleted = completedFuelingsCount + (leanAndGreen.completed ? 1 : 0);

      if (!loaded) {
        return (
          <div className="min-h-screen bg-slate-50 flex items-center justify-center">
            <p className="text-slate-400 text-sm">Loading your progress…</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 p-4 sm:p-6 pb-12 pt-8 text-slate-800">
          <div className="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">

            {/* Header */}
            <div className="bg-teal-600 text-white p-6 text-center">
              <h1 className="text-2xl font-bold tracking-wide">Fueling & Hydration Tracker</h1>
              <p className="text-teal-100 text-sm mt-1">Stay on track with your 5 & 1 Plan</p>
            </div>

            <div className="p-6 space-y-6">

              {/* Water Tracker Section */}
              <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <div className="flex justify-between items-center mb-2">
                  <h2 className="font-semibold text-blue-900 flex items-center gap-2">
                    💧 Water Intake
                  </h2>
                  <span className="text-sm font-bold text-blue-700">{water} oz / {waterTarget} oz</span>
                </div>

                {/* Progress Bar */}
                <div className="w-full bg-blue-200 h-3 rounded-full overflow-hidden mb-4">
                  <div
                    className="bg-blue-500 h-full transition-all duration-300"
                    style={{ width: `${waterProgress}%` }}
                  ></div>
                </div>

                {/* Quick Add Buttons */}
                <div className="grid grid-cols-4 gap-2">
                  <button onClick={() => addWater(8)} className="bg-white active:bg-blue-100 text-blue-700 border border-blue-200 py-2 rounded-lg text-sm font-medium transition">+8 oz</button>
                  <button onClick={() => addWater(16)} className="bg-white active:bg-blue-100 text-blue-700 border border-blue-200 py-2 rounded-lg text-sm font-medium transition">+16 oz</button>
                  <button onClick={() => addWater(-8)} className="bg-white active:bg-red-50 text-red-600 border border-red-200 py-2 rounded-lg text-sm font-medium transition">-8 oz</button>
                  <button onClick={() => setWater(0)} className="bg-slate-200 active:bg-slate-300 text-slate-700 py-2 rounded-lg text-sm font-medium transition">Reset</button>
                </div>
              </div>

              {/* Meal Schedule Section */}
              <div>
                <div className="flex justify-between items-center mb-3">
                  <h2 className="font-semibold text-slate-900">🍽️ Daily Meal Schedule</h2>
                  <span className="text-xs font-semibold bg-teal-100 text-teal-800 px-2.5 py-1 rounded-full">
                    {totalMealsCompleted} / 6 Completed
                  </span>
                </div>

                {/* Fuelings List */}
                <div className="space-y-2.5 mb-3">
                  {fuelings.map((fueling) => (
                    <div
                      key={fueling.id}
                      className={`flex items-center justify-between p-3 rounded-xl border transition ${
                        fueling.completed
                          ? 'bg-teal-50 border-teal-200 text-teal-900 line-through opacity-75'
                          : 'bg-white border-slate-200'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <input
                          type="checkbox"
                          checked={fueling.completed}
                          onChange={() => toggleFueling(fueling.id)}
                          className="w-5 h-5 text-teal-600 rounded focus:ring-teal-500 cursor-pointer"
                        />
                        <div>
                          <p className="font-medium text-sm">{fueling.name}</p>
                          <div className="flex items-center gap-1.5 text-xs text-slate-500">
                            <span>{fueling.completed ? 'Completed:' : 'Target:'}</span>
                            {editingId === fueling.id ? (
                              <input
                                type="text"
                                value={fueling.time}
                                onChange={(e) => updateFuelingTime(fueling.id, e.target.value)}
                                onBlur={() => setEditingId(null)}
                                onKeyDown={(e) => e.key === 'Enter' && setEditingId(null)}
                                autoFocus
                                className="border border-teal-400 rounded px-1.5 py-0.5 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-1 focus:ring-teal-500 bg-white"
                              />
                            ) : (
                              <button
                                onClick={() => setEditingId(fueling.id)}
                                className="font-semibold underline decoration-dashed underline-offset-2 hover:text-teal-700 focus:outline-none"
                              >
                                {fueling.time} ✏️
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                      <span className={`text-xs px-2 py-1 rounded ${fueling.completed ? 'bg-teal-200 text-teal-800 font-normal no-underline' : 'bg-slate-100 text-slate-600'}`}>
                        {fueling.completed ? 'Done' : 'Pending'}
                      </span>
                    </div>
                  ))}
                </div>

                {/* Lean & Green Meal */}
                <div
                  className={`flex items-center justify-between p-3 rounded-xl border transition ${
                    leanAndGreen.completed
                      ? 'bg-emerald-50 border-emerald-200 text-emerald-900 line-through opacity-75'
                      : 'bg-emerald-50/50 border-emerald-200'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <input
                      type="checkbox"
                      checked={leanAndGreen.completed}
                      onChange={toggleLeanAndGreen}
                      className="w-5 h-5 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer"
                    />
                    <div>
                      <p className="font-medium text-sm text-emerald-950">🥗 {leanAndGreen.name}</p>
                      <div className="flex items-center gap-1.5 text-xs text-emerald-700">
                        <span>{leanAndGreen.completed ? 'Completed:' : 'Target:'}</span>
                        {editingId === 'lean_green' ? (
                          <input
                            type="text"
                            value={leanAndGreen.time}
                            onChange={(e) => updateLeanAndGreenTime(e.target.value)}
                            onBlur={() => setEditingId(null)}
                            onKeyDown={(e) => e.key === 'Enter' && setEditingId(null)}
                            autoFocus
                            className="border border-emerald-400 rounded px-1.5 py-0.5 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-1 focus:ring-emerald-500 bg-white"
                          />
                        ) : (
                          <button
                            onClick={() => setEditingId('lean_green')}
                            className="font-semibold underline decoration-dashed underline-offset-2 hover:text-emerald-900 focus:outline-none"
                          >
                            {leanAndGreen.time || 'Flexible'} ✏️
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                  <span className={`text-xs px-2 py-1 rounded ${leanAndGreen.completed ? 'bg-emerald-200 text-emerald-800 font-normal no-underline' : 'bg-emerald-100 text-emerald-700'}`}>
                    {leanAndGreen.completed ? 'Done' : 'Pending'}
                  </span>
                </div>
              </div>

              {/* Footer Reset Action */}
              <div className="pt-2 border-t border-slate-100 flex justify-between items-center">
                <span className="text-xs text-slate-400">
                  {saveError ? 'Local storage failed' : 'Saved locally'}
                </span>
                <button
                  onClick={resetDay}
                  className="text-xs text-red-500 hover:text-red-700 font-medium transition"
                >
                  Reset Entire Day
                </button>
              </div>

            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FuelingTracker />);
  </script>
</body>
</html>
